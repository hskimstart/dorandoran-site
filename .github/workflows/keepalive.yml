# 무료 Supabase 프로젝트는 1주일 동안 아무도 쓰지 않으면 멈춘다.
# 매일 한 번 확인용 함수(ping)를 불러 신청서 저장소가 멈추지 않게 한다. 신청 내용은 읽지 않는다.
name: keep supabase awake
on:
  schedule:
    - cron: "17 0 * * *"   # 매일 오전 9시 17분(한국 시간)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ping
        run: |
          URL=$(grep -o 'url: "[^"]*"' assets/config.js | head -1 | cut -d'"' -f2)
          KEY=$(grep -o 'key: "[^"]*"' assets/config.js | head -1 | cut -d'"' -f2)
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'

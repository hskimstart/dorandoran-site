<main class="wrap qr-page">
  <p class="no-print" style="color:var(--muted);text-align:center;max-width:44ch">테이블에 놓을 카드예요. 주소 끝의 <b>?id=</b>에 뮤지션 id를 넣고 인쇄하세요. 현장에서는 QR 위에 다른 스티커가 붙어 있지 않은지 모임 전에 꼭 확인하세요.</p>
  <div class="qr-card" id="qrCard">

    <span class="nm" id="qrName"></span>

  </div>
  <button class="btn solid no-print" id="print" type="button">인쇄하기</button>
